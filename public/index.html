<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2117"><link rel="manifest" href="/manifest.webmanifest">
<title>VerdeJá — Verduras na sua cidade</title>
<style>
:root{--green:#0b2117;--green2:#174c2b;--gold:#d8ad43;--bg:#f5f7f4;--card:#fff;--text:#172018;--muted:#68736b;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--green);color:white;position:sticky;top:0;z-index:10}.nav{max-width:1180px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:14px}.logo{font-size:25px;font-weight:900;color:#fff}.logo span{color:var(--gold)}.grow{flex:1}
button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer}.btn{background:var(--green2);color:#fff}.gold{background:var(--gold);color:#132015;font-weight:800}.ghost{background:#ffffff16;color:#fff}.light{background:#edf2ee}.danger{background:#fee4e2;color:var(--danger)}
main{max-width:1180px;margin:auto;padding:22px 16px}.hero{background:linear-gradient(120deg,#0b2117,#28623a);color:#fff;border-radius:22px;padding:30px;margin-bottom:22px}.hero h1{font-size:clamp(28px,5vw,48px);margin:0 0 8px}.hero p{color:#d9e6dc}.search{display:flex;gap:8px}.search input{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 3px 18px #14251a0b}.product-img{height:145px;border-radius:12px;background:#e6efe7;display:flex;align-items:center;justify-content:center;font-size:55px;margin-bottom:12px;overflow:hidden}.product-img img{width:100%;height:100%;object-fit:cover}.price{font-size:21px;font-weight:900}.muted{color:var(--muted);font-size:14px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.section{margin:28px 0}.panel{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{border:1px solid #d5ddd7;border-radius:10px;padding:11px;background:#fff}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabs button{white-space:nowrap}.pill{padding:5px 9px;border-radius:999px;background:#e7f1e8;font-size:12px}.total{font-size:26px;font-weight:900}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modalbox{background:#fff;border-radius:18px;max-width:650px;width:100%;max-height:90vh;overflow:auto;padding:22px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#15251b;color:#fff;padding:12px 18px;border-radius:999px;z-index:100}.hidden{display:none!important}
@media(max-width:650px){.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.nav{padding:12px}.hero{padding:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:12px}.search{flex-direction:column}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">Verde<span>Já</span></div><div class="grow"></div><button class="ghost" onclick="openAuth()">Entrar / Cadastrar</button><button class="gold" onclick="openCart()">🛒 <span id="cartCount">0</span></button></div></header>
<main>
<section class="hero"><h1>Verduras frescas, do vendedor para você.</h1><p>Marketplace de verduras, hortaliças e produtos frescos em qualquer cidade do Brasil.</p><div class="search"><input id="search" placeholder="Buscar alface, tomate, couve..." oninput="loadProducts()"><button class="gold" onclick="loadProducts()">Buscar</button></div></section>
<div id="app"></div>
</main>
<div id="modal"></div><div id="toast" class="toast hidden"></div>
<script>
let token=localStorage.getItem("vj_token"), me=null, products=[], cart=JSON.parse(localStorage.getItem("vj_cart")||"[]"), settings={commission:10,freeShippingMin:30,maxShipping:10};
const $=s=>document.querySelector(s), api=async(url,opt={})=>{opt.headers={...(opt.headers||{}), "Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Erro");return d};
function toast(t){let x=$("#toast");x.textContent=t;x.classList.remove("hidden");setTimeout(()=>x.classList.add("hidden"),2800)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(n){return Number(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function saveCart(){localStorage.setItem("vj_cart",JSON.stringify(cart));$("#cartCount").textContent=cart.reduce((s,i)=>s+i.qty,0)}
async function init(){settings=await api("/api/settings"); if(token)try{me=await api("/api/me")}catch(e){token=null;localStorage.removeItem("vj_token")}saveCart();loadProducts();if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js")}
async function loadProducts(){let q=$("#search")?.value||"";products=await api("/api/products?q="+encodeURIComponent(q));renderHome()}
function renderHome(){
 let h=`<div class="section"><div class="row"><h2>Produtos frescos</h2><span class="pill">Frete grátis acima de ${money(settings.freeShippingMin)}</span></div><div class="grid">`;
 if(!products.length)h+=`<div class="panel">Nenhum produto encontrado. Seja o primeiro vendedor da sua cidade.</div>`;
 products.forEach(p=>h+=`<article class="card"><div class="product-img">${p.image?`<img src="${esc(p.image)}">`:"🥬"}</div><b>${esc(p.name)}</b><div class="muted">${esc(p.description||"Produto fresco")} • ${esc(p.unit)}</div><div class="muted">Vendedor: ${esc(p.sellerName)} • ${esc(p.city)}</div><div class="row" style="margin-top:10px"><span class="price">${money(p.price)}</span><button class="btn" onclick="add('${p.id}')">Adicionar</button></div></article>`);
 h+=`</div></div><div class="section panel"><h2>Como funciona</h2><div class="grid"><div>🧑‍🌾 <b>Vendedores</b><p class="muted">Cadastrem produtos, preços, estoque e pagamentos aceitos.</p></div><div>🚚 <b>Entregadores</b><p class="muted">Recebam e acompanhem entregas.</p></div><div>💳 <b>Pagamentos</b><p class="muted">Pix, crédito e débito conforme a configuração do vendedor.</p></div></div></div>`;
 if(me)h+=dashboard();
 $("#app").innerHTML=h
}
function add(id){let p=products.find(x=>x.id===id),i=cart.find(x=>x.productId===id);if(i)i.qty++;else cart.push({productId:id,qty:1});saveCart();toast("Produto adicionado ao carrinho")}
function openCart(){if(!cart.length)return toast("Seu carrinho está vazio.");let html=`<div class="modal"><div class="modalbox"><div class="row"><h2>Seu carrinho</h2><div class="grow"></div><button class="light" onclick="closeModal()">Fechar</button></div>`;
let subtotal=0;cart.forEach(i=>{let p=products.find(x=>x.id===i.productId);if(!p)return;let sub=p.price*i.qty;subtotal+=sub;html+=`<div class="panel"><div class="row"><b>${esc(p.name)}</b><div class="grow"></div><button class="light" onclick="chg('${p.id}',-1)">−</button><b>${i.qty}</b><button class="light" onclick="chg('${p.id}',1)">+</button><b>${money(sub)}</b></div></div>`});
let ship=subtotal>=settings.freeShippingMin?0:Math.min(settings.maxShipping,3);html+=`<p>Subtotal: <b>${money(subtotal)}</b></p><p>Frete: <b>${ship?money(ship):"GRÁTIS"}</b></p><p class="total">Total: ${money(subtotal+ship)}</p><button class="gold" style="width:100%" onclick="checkout()">Ir para pagamento</button></div></div>`;$("#modal").innerHTML=html}
function chg(id,n){let i=cart.find(x=>x.productId===id);if(i)i.qty+=n;cart=cart.filter(x=>x.qty>0);saveCart();openCart()}
function closeModal(){$("#modal").innerHTML=""}
function openAuth(){let html=`<div class="modal"><div class="modalbox"><div class="row"><h2>VerdeJá</h2><div class="grow"></div><button class="light" onclick="closeModal()">Fechar</button></div><div class="tabs"><button class="btn" onclick="authForm('login')">Entrar</button><button class="light" onclick="authForm('register')">Criar conta</button></div><div id="authform"></div></div></div>`;$("#modal").innerHTML=html;authForm("login")}
function authForm(type){$("#authform").innerHTML=type==="login"?`<form onsubmit="login(event)" class="fields"><label class="field full">E-mail<input id="aemail" type="email" required></label><label class="field full">Senha<input id="apass" type="password" required></label><button class="gold field full">Entrar</button></form>`:`<form onsubmit="register(event)" class="fields"><label class="field">Nome<input id="rname" required></label><label class="field">Telefone<input id="rphone"></label><label class="field">E-mail<input id="remail" type="email" required></label><label class="field">Senha<input id="rpass" type="password" minlength="6" required></label><label class="field">Cidade<input id="rcity" required></label><label class="field">UF<input id="rstate" maxlength="2" required></label><label class="field full">Perfil<select id="rrole"><option value="customer">Cliente</option><option value="seller">Vendedor</option><option value="courier">Entregador</option></select></label><button class="gold field full">Cadastrar</button></form>`}
async function login(e){e.preventDefault();try{let d=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("#aemail").value,password:$("#apass").value})});token=d.token;localStorage.setItem("vj_token",token);me=d.user;closeModal();toast("Bem-vindo ao VerdeJá!");loadProducts()}catch(x){toast(x.message)}}
async function register(e){e.preventDefault();try{let d=await api("/api/auth/register",{method:"POST",body:JSON.stringify({name:$("#rname").value,email:$("#remail").value,password:$("#rpass").value,phone:$("#rphone").value,city:$("#rcity").value,state:$("#rstate").value,role:$("#rrole").value})});if(d.pending){closeModal();toast(d.message)}else{token=d.token;localStorage.setItem("vj_token",token);me=d.user;closeModal();toast("Conta criada!")}loadProducts()}catch(x){toast(x.message)}}
function dashboard(){
 if(me.role==="customer")return `<div class="section panel"><div class="row"><h2>Olá, ${esc(me.name)}</h2><div class="grow"></div><button class="light" onclick="logout()">Sair</button></div><button class="btn" onclick="myOrders()">Meus pedidos</button></div>`;
 if(me.role==="seller")return `<div class="section panel"><div class="row"><h2>Painel do vendedor</h2><div class="grow"></div><button class="light" onclick="logout()">Sair</button></div><div class="row"><button class="btn" onclick="sellerProduct()">Cadastrar produto</button><button class="light" onclick="sellerSettings()">Pagamentos e recebimento</button><button class="light" onclick="sellerOrders()">Pedidos</button></div></div>`;
 if(me.role==="courier")return `<div class="section panel"><div class="row"><h2>Painel do entregador</h2><div class="grow"></div><button class="light" onclick="logout()">Sair</button></div><button class="btn" onclick="courierJobs()">Entregas disponíveis</button></div>`;
 return `<div class="section panel"><div class="row"><h2>Administração</h2><div class="grow"></div><button class="light" onclick="logout()">Sair</button></div><button class="btn" onclick="adminPanel()">Abrir painel administrativo</button></div>`
}
function logout(){token=null;me=null;localStorage.removeItem("vj_token");loadProducts();toast("Sessão encerrada")}
function sellerProduct(){openPanel(`<h2>Novo produto</h2><form onsubmit="saveProduct(event)" class="fields"><label class="field">Nome<input id="pn" required></label><label class="field">Preço<input id="pp" type="number" step="0.01" required></label><label class="field">Unidade<input id="pu" value="unidade"></label><label class="field">Estoque<input id="ps" type="number" min="0" required></label><label class="field">Cidade<input id="pc" value="${esc(me.city)}" required></label><label class="field">Foto (URL)<input id="pi" placeholder="https://..."></label><label class="field full">Descrição<textarea id="pd"></textarea></label><button class="gold field full">Salvar produto</button></form>`)}
async function saveProduct(e){e.preventDefault();try{await api("/api/products",{method:"POST",body:JSON.stringify({name:$("#pn").value,price:$("#pp").value,unit:$("#pu").value,stock:$("#ps").value,city:$("#pc").value,image:$("#pi").value,description:$("#pd").value})});closeModal();loadProducts();toast("Produto cadastrado")}catch(x){toast(x.message)}}
async function sellerSettings(){let s=await api("/api/seller/summary");openPanel(`<h2>Pagamentos e recebimento</h2><p class="muted">Escolha o que seu cliente poderá usar no checkout.</p><form onsubmit="savePay(event)" class="fields"><label class="field full"><span><input id="pix" type="checkbox" ${s.paymentMethods.pix?"checked":""}> Pix</span></label><label class="field full"><span><input id="cc" type="checkbox" ${s.paymentMethods.creditCard?"checked":""}> Cartão de crédito</span></label><label class="field full"><span><input id="dc" type="checkbox" ${s.paymentMethods.debitCard?"checked":""}> Cartão de débito</span></label><button class="gold field full">Salvar formas de pagamento</button></form><hr><h3>Conta de recebimento</h3><form onsubmit="savePayout(event)" class="fields"><label class="field full">Tipo<select id="pt"><option value="pix" ${s.payout?.type==="pix"?"selected":""}>Pix</option><option value="bank" ${s.payout?.type==="bank"?"selected":""}>Conta bancária</option></select></label><label class="field full">Chave Pix<input id="pk" value="${esc(s.payout?.pixKey)}"></label><label class="field">Banco<input id="pb" value="${esc(s.payout?.bank)}"></label><label class="field">Agência<input id="pa" value="${esc(s.payout?.agency)}"></label><label class="field">Conta<input id="pcn" value="${esc(s.payout?.account)}"></label><label class="field">Titular<input id="ph" value="${esc(s.payout?.holderName)}"></label><label class="field">CPF/CNPJ<input id="pdn" value="${esc(s.payout?.document)}"></label><button class="gold field full">Salvar recebimento</button></form><p class="muted">A transferência automática depende da integração com o gateway de pagamentos escolhido pela plataforma.</p>`)}
async function savePay(e){e.preventDefault();try{await api("/api/seller/payment-settings",{method:"PUT",body:JSON.stringify({pix:$("#pix").checked,creditCard:$("#cc").checked,debitCard:$("#dc").checked})});toast("Formas de pagamento salvas");sellerSettings()}catch(x){toast(x.message)}}
async function savePayout(e){e.preventDefault();try{await api("/api/seller/payout",{method:"PUT",body:JSON.stringify({type:$("#pt").value,pixKey:$("#pk").value,bank:$("#pb").value,agency:$("#pa").value,account:$("#pcn").value,holderName:$("#ph").value,document:$("#pdn").value})});toast("Dados de recebimento salvos")}catch(x){toast(x.message)}}
async function sellerOrders(){let os=await api("/api/orders");openPanel(`<h2>Pedidos</h2>${os.length?os.map(o=>`<div class="panel"><b>${o.id}</b> — ${money(o.total)} <span class="pill">${o.status}</span><p>${o.items.map(i=>esc(i.name)+" × "+i.qty).join(", ")}</p><button class="btn" onclick="setStatus('${o.id}','preparing')">Preparando</button> <button class="btn" onclick="setStatus('${o.id}','ready')">Pronto para entrega</button></div>`).join(""):"Nenhum pedido ainda."}`)}
async function setStatus(id,status){try{await api("/api/orders/"+id+"/status",{method:"PATCH",body:JSON.stringify({status})});toast("Status atualizado");sellerOrders()}catch(x){toast(x.message)}}
async function myOrders(){let os=await api("/api/orders");openPanel(`<h2>Meus pedidos</h2>${os.length?os.map(o=>`<div class="panel"><b>${o.id}</b><br>Total: ${money(o.total)}<br>Status: <span class="pill">${o.status}</span><p>Pagamento: ${esc(o.paymentMethod)}</p></div>`).join(""):"Você ainda não fez pedidos."}`)}
async function courierJobs(){let os=await api("/api/courier/available");openPanel(`<h2>Entregas disponíveis</h2>${os.length?os.map(o=>`<div class="panel"><b>${o.id}</b> • ${money(o.total)}<p>${esc(o.address.city)} — ${esc(o.address.street||"")}</p><button class="btn" onclick="acceptJob('${o.id}')">Aceitar entrega</button></div>`).join(""):"Nenhuma entrega disponível."}`)}
async function acceptJob(id){try{await api("/api/courier/orders/"+id+"/accept",{method:"POST"});toast("Entrega aceita");courierJobs()}catch(x){toast(x.message)}}
async function adminPanel(){let [u,s]=await Promise.all([api("/api/admin/users"),api("/api/admin/summary")]);openPanel(`<h2>Administração</h2><div class="grid"><div class="card">Usuários<br><b>${s.users}</b></div><div class="card">Pedidos<br><b>${s.orders}</b></div><div class="card">Comissão<br><b>${s.settings.commission}%</b></div><div class="card">Receita plataforma<br><b>${money(s.platformRevenue)}</b></div></div><h3>Regras</h3><form onsubmit="saveAdmin(event)" class="fields"><label class="field">Comissão %<input id="ac" type="number" step="0.1" value="${s.settings.commission}"></label><label class="field">Frete grátis a partir de R$<input id="af" type="number" step="0.01" value="${s.settings.freeShippingMin}"></label><label class="field">Frete máximo R$<input id="am" type="number" step="0.01" value="${s.settings.maxShipping}"></label><button class="gold field">Salvar regras</button></form><h3>Usuários</h3>${u.map(x=>`<div class="panel"><b>${esc(x.name)}</b> — ${esc(x.email)}<br>${x.role} • ${x.city}/${x.state} • <span class="pill">${x.status}</span>${x.role!=="admin"?`<div class="row" style="margin-top:8px"><button class="btn" onclick="userStatus('${x.id}','active')">Aprovar/Ativar</button><button class="danger" onclick="userStatus('${x.id}','blocked')">Bloquear</button></div>`:""}</div>`).join("")}`)}
async function saveAdmin(e){e.preventDefault();try{settings=await api("/api/admin/settings",{method:"PUT",body:JSON.stringify({commission:$("#ac").value,freeShippingMin:$("#af").value,maxShipping:$("#am").value})});toast("Regras salvas");adminPanel()}catch(x){toast(x.message)}}
async function userStatus(id,status){try{await api("/api/admin/users/"+id,{method:"PATCH",body:JSON.stringify({status})});adminPanel()}catch(x){toast(x.message)}}
function openPanel(content){$("#modal").innerHTML=`<div class="modal"><div class="modalbox"><div class="row"><div class="grow"></div><button class="light" onclick="closeModal()">Fechar</button></div>${content}</div></div>`}
async function checkout(){
 if(!token||!me||me.role!=="customer"){closeModal();openAuth();return}
 let html=`<div class="modal"><div class="modalbox"><h2>Finalizar pedido</h2><form onsubmit="placeOrder(event)" class="fields"><label class="field full">Rua e número<input id="os" required></label><label class="field">Bairro<input id="ob"></label><label class="field">Cidade<input id="oc" value="${esc(me.city)}" required></label><label class="field">UF<input id="ou" value="${esc(me.state)}" maxlength="2" required></label><label class="field">CEP<input id="oz"></label><label class="field">Distância estimada (km)<input id="od" type="number" step="0.1" value="0"></label><label class="field full">Forma de pagamento<select id="op" required><option value="">Escolha</option><option value="pix">Pix</option><option value="creditCard">Cartão de crédito</option><option value="debitCard">Cartão de débito</option></select></label><p class="muted field full">As opções efetivamente disponíveis serão validadas conforme os vendedores do carrinho.</p><button class="gold field full">Confirmar pedido</button></form></div></div>`;$("#modal").innerHTML=html}
async function placeOrder(e){e.preventDefault();try{let d=await api("/api/orders",{method:"POST",body:JSON.stringify({items:cart,address:{street:$("#os").value,neighborhood:$("#ob").value,city:$("#oc").value,state:$("#ou").value,zip:$("#oz").value,distanceKm:Number($("#od").value||0)},paymentMethod:$("#op").value})});cart=[];saveCart();closeModal();toast("Pedido "+d.id+" confirmado!");myOrders()}catch(x){toast(x.message)}}
init();
</script>
</body></html>
